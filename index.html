<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mynav</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a56db">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== TOKENS ===== */
    :root {
      --brand:       #1a56db;
      --brand-dark:  #1341b0;
      --brand-light: #3b82f6;
      --surface:     #ffffff;
      --surface-2:   #f0f4ff;
      --surface-3:   #e8eef8;
      --text-1:      #0f172a;
      --text-2:      #475569;
      --text-3:      #94a3b8;
      --border:      #dde3f0;
      --shadow-sm:   0 1px 4px rgba(26,86,219,0.08);
      --shadow-md:   0 4px 16px rgba(26,86,219,0.12);
      --shadow-lg:   0 8px 32px rgba(26,86,219,0.16);
      --radius-sm:   10px;
      --radius-md:   16px;
      --radius-lg:   24px;
      --radius-full: 9999px;
    }
    body.night {
      --brand:       #3b82f6;
      --brand-dark:  #1d4ed8;
      --brand-light: #60a5fa;
      --surface:     #0f1729;
      --surface-2:   #172040;
      --surface-3:   #1e2d52;
      --text-1:      #f0f6ff;
      --text-2:      #93b4d8;
      --text-3:      #4d6a8a;
      --border:      #1e3a5f;
      --shadow-sm:   0 1px 4px rgba(0,0,0,0.3);
      --shadow-md:   0 4px 16px rgba(0,0,0,0.4);
      --shadow-lg:   0 8px 32px rgba(0,0,0,0.5);
    }
    body.night .leaflet-tile {
      filter: brightness(0.75) contrast(1.1) saturate(0.9);
    }
    body.night .leaflet-container { background: #0a0f1e; }

    /* ===== BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--surface-2);
      color: var(--text-1);
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== HEADER ===== */
    #header {
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
      color: white;
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 12px rgba(26,86,219,0.35);
      position: relative; z-index: 1000;
    }
    #header-left {
      display: flex; align-items: center; gap: 10px;
    }
    #logo-mark {
      width: 34px; height: 34px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.25);
      font-size: 18px;
    }
    #app-name {
      display: flex; flex-direction: column; line-height: 1.1;
    }
    #app-name span:first-child {
      font-size: 17px; font-weight: 700; letter-spacing: -0.3px;
    }
    #app-name span:last-child {
      font-size: 10px; font-weight: 400; opacity: 0.7; letter-spacing: 0.3px;
    }
    #header-right {
      display: flex; align-items: center; gap: 8px;
    }
    #weather-display {
      font-size: 13px; font-weight: 500;
      background: rgba(255,255,255,0.15);
      padding: 5px 10px; border-radius: var(--radius-full);
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
    }
    #night-toggle {
      width: 34px; height: 34px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: var(--radius-full);
      color: white; font-size: 15px;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
      transition: background 0.2s;
    }
    #night-toggle:hover { background: rgba(255,255,255,0.25); }
    #radar-count {
      font-size: 11px; font-weight: 500;
      background: rgba(255,255,255,0.15);
      padding: 4px 9px; border-radius: var(--radius-full);
      border: 1px solid rgba(255,255,255,0.2);
      white-space: nowrap;
    }

    /* ===== BARRE RECHERCHE ===== */
    #search-bar {
      background: var(--surface);
      padding: 10px 12px;
      display: flex; gap: 8px; align-items: center;
      box-shadow: var(--shadow-sm);
      position: relative; z-index: 999;
      border-bottom: 1px solid var(--border);
    }
    #search-input {
      flex: 1; min-width: 0;
      padding: 10px 14px;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 14px; font-family: inherit;
      color: var(--text-1); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #search-input::placeholder { color: var(--text-3); }
    #search-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(26,86,219,0.12);
      background: var(--surface);
    }
    .icon-btn {
      width: 40px; height: 40px; flex-shrink: 0;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-2); font-size: 16px;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .icon-btn:hover { background: var(--surface-3); border-color: var(--brand); color: var(--brand); }
    #voice-btn.listening {
      background: #fee2e2; border-color: #ef4444; color: #ef4444;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

    #search-btn {
      padding: 10px 16px; flex-shrink: 0;
      background: var(--brand);
      color: white; border: none;
      border-radius: var(--radius-md);
      font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(26,86,219,0.3);
    }
    #search-btn:hover { background: var(--brand-dark); }
    #search-btn:active { transform: scale(0.97); }

    /* ===== BARRE ACTIONS ===== */
    #action-bar {
      background: var(--surface);
      padding: 8px 12px;
      display: flex; gap: 8px;
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      position: relative; z-index: 998;
    }
    .action-btn {
      flex: 1;
      padding: 9px 4px;
      background: var(--surface-2);
      color: var(--brand);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 12px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; gap: 2px;
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: var(--brand);
      color: white;
      border-color: var(--brand);
      box-shadow: 0 2px 8px rgba(26,86,219,0.3);
      transform: translateY(-1px);
    }
    .action-btn:active { transform: translateY(0); }
    .action-btn .btn-icon { font-size: 16px; line-height: 1; }
    .action-btn .btn-label { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
    button:disabled { opacity: 0.5 !important; cursor: not-allowed !important; transform: none !important; }

    /* ===== OPTIONS ===== */
    #options-bar {
      background: var(--surface-2);
      padding: 7px 14px;
      display: flex; align-items: center; gap: 16px;
      font-size: 12px; font-weight: 500;
      border-bottom: 1px solid var(--border);
      color: var(--text-2); flex-wrap: wrap;
    }
    #options-bar label {
      display: flex; align-items: center;
      gap: 6px; cursor: pointer; user-select: none;
    }
    #options-bar input[type="checkbox"] {
      accent-color: var(--brand);
      width: 14px; height: 14px;
    }
    #radar-toggle-label { color: #dc2626; font-weight: 600; }

    /* ===== CARTE ===== */
    #map {
      height: calc(100vh - 204px);
      width: 100%;
    }

    /* ===== STATUS ===== */
    #status {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      padding: 9px 18px;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-md);
      font-size: 13px; font-weight: 500;
      color: var(--text-2);
      z-index: 1000; max-width: 88%; text-align: center;
      border: 1px solid var(--border);
    }

    /* ===== ALERTE RADAR ===== */
    #radar-alert {
      position: absolute; top: 210px; left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: white;
      padding: 12px 20px; border-radius: var(--radius-md);
      box-shadow: 0 4px 20px rgba(220,38,38,0.45);
      font-size: 15px; font-weight: 700;
      z-index: 1001; display: none;
      text-align: center; white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* ===== INFOS ROUTE ===== */
    #route-info {
      position: absolute; bottom: 20px; left: 12px; right: 12px;
      background: var(--surface);
      padding: 14px 16px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      z-index: 999; display: none;
      border: 1px solid var(--border);
    }
    .route-row {
      display: flex; align-items: center; gap: 10px; padding: 7px 0;
    }
    .route-row + .route-row { border-top: 1px solid var(--border); }
    .route-dot {
      width: 10px; height: 10px;
      border-radius: 50%; flex-shrink: 0;
    }
    .route-label {
      font-size: 12px; font-weight: 500;
      color: var(--text-2); flex-shrink: 0;
    }
    .route-data {
      font-weight: 700; font-size: 15px;
      color: var(--text-1);
    }

    /* ===== RÉSULTATS ===== */
    #results {
      position: absolute; top: 210px; left: 12px; right: 12px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      max-height: 320px; overflow-y: auto;
      z-index: 1000; display: none;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .result-item {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer; font-size: 13px;
      color: var(--text-1);
      display: flex; align-items: center; gap: 8px;
      transition: background 0.15s;
    }
    .result-item:hover { background: var(--surface-2); }
    .result-item:last-child { border-bottom: none; }
    .result-fav-btn {
      background: none; border: none; font-size: 16px;
      cursor: pointer; padding: 0 4px; flex-shrink: 0;
      color: var(--text-3); transition: color 0.2s;
    }
    .result-fav-btn:hover { color: #f59e0b; }

    /* ===== PANNEAUX ===== */
    #fav-panel, #poi-panel {
      position: absolute; top: 210px; left: 12px; right: 12px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      z-index: 1000; display: none;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    #fav-panel { max-height: 65vh; overflow-y: auto; }

    .panel-header {
      padding: 14px 16px 12px;
      font-size: 15px; font-weight: 700;
      color: var(--text-1);
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }
    .panel-close {
      width: 28px; height: 28px;
      background: var(--surface-3);
      border: none; border-radius: var(--radius-full);
      color: var(--text-2); font-size: 14px;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }

    .fav-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; transition: background 0.15s;
    }
    .fav-item:hover { background: var(--surface-2); }
    .fav-item:last-child { border-bottom: none; }
    .fav-item-name { font-size: 13px; font-weight: 600; color: var(--text-1); }
    .fav-item-addr { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .fav-del-btn {
      background: none; border: none; font-size: 15px;
      cursor: pointer; color: #ef4444; padding: 4px; flex-shrink: 0;
      border-radius: var(--radius-sm);
      transition: background 0.2s;
    }
    .fav-del-btn:hover { background: #fee2e2; }
    #fav-empty {
      padding: 32px 16px; text-align: center;
      color: var(--text-3); font-size: 14px; line-height: 1.6;
    }

    /* POI */
    #poi-panel-body { padding: 14px 16px; }
    #poi-categories {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-bottom: 14px;
    }
    #poi-categories label {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 500;
      cursor: pointer; padding: 9px 12px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      color: var(--text-1);
      background: var(--surface-2);
      transition: all 0.15s;
    }
    #poi-categories label:hover {
      border-color: var(--brand);
      background: var(--surface);
    }
    #poi-categories input[type="checkbox"] { accent-color: var(--brand); }
    #poi-categories input:checked ~ span { font-weight: 600; color: var(--brand); }
    #poi-actions { display: flex; gap: 8px; }
    #poi-search-btn {
      flex: 1; padding: 11px;
      background: var(--brand); color: white;
      border: none; border-radius: var(--radius-md);
      font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      box-shadow: 0 2px 8px rgba(26,86,219,0.3);
      transition: background 0.2s;
    }
    #poi-search-btn:hover { background: var(--brand-dark); }
    #poi-clear-btn, #poi-close-btn {
      padding: 11px 14px;
      background: var(--surface-2); color: var(--text-2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 13px; font-weight: 500;
      font-family: inherit; cursor: pointer;
      transition: all 0.15s;
    }
    #poi-clear-btn:hover, #poi-close-btn:hover {
      background: var(--surface-3);
      border-color: var(--text-3);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div id="header">
    <div id="header-left">
      <div id="logo-mark">🧭</div>
      <div id="app-name">
        <span>Mynav</span>
        <span>by ManuelM</span>
      </div>
    </div>
    <div id="header-right">
      <span id="weather-display"></span>
      <button id="night-toggle">🌙</button>
      <span id="radar-count">...</span>
    </div>
  </div>

  <!-- BARRE RECHERCHE -->
  <div id="search-bar">
    <input type="text" id="search-input" placeholder="Où allons-nous ?" />
    <button class="icon-btn" id="voice-btn" title="Recherche vocale">🎤</button>
    <button class="icon-btn" id="fav-save-btn" title="Ajouter aux favoris">⭐</button>
    <button id="search-btn">Chercher</button>
  </div>

  <!-- BARRE ACTIONS -->
  <div id="action-bar">
    <button class="action-btn" id="route-btn">
      <span class="btn-icon">🔵</span>
      <span class="btn-label">Route</span>
    </button>
    <button class="action-btn" id="compare-btn">
      <span class="btn-icon">⚖️</span>
      <span class="btn-label">Comparer</span>
    </button>
    <button class="action-btn" id="poi-btn">
      <span class="btn-icon">📍</span>
      <span class="btn-label">POI</span>
    </button>
    <button class="action-btn" id="fav-btn">
      <span class="btn-icon">⭐</span>
      <span class="btn-label">Favoris</span>
    </button>
  </div>

  <!-- OPTIONS -->
  <div id="options-bar">
    <label><input type="checkbox" id="avoid-tolls" checked /> Éviter péages</label>
    <label><input type="checkbox" id="avoid-highways" /> Éviter autoroutes</label>
    <label id="radar-toggle-label"><input type="checkbox" id="show-radars" checked /> 📷 Radars</label>
  </div>

  <!-- CARTE -->
  <div id="map"></div>
  <button id="recenter-btn" title="Recentrer sur ma position" style="
    position:absolute;
    bottom:90px;
    right:14px;
    z-index:1000;
    width:44px;
    height:44px;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:50%;
    box-shadow:var(--shadow-md);
    font-size:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.2s;
  ">📍</button>
  <div id="results"></div>

  <!-- PANNEAU FAVORIS -->
  <div id="fav-panel">
    <div class="panel-header">
      <span>⭐ Mes favoris</span>
      <button class="panel-close" id="fav-close-btn">✕</button>
    </div>
    <div id="fav-list"></div>
  </div>

  <!-- PANNEAU POI -->
  <div id="poi-panel">
    <div class="panel-header">
      <span>📍 Autour de moi · 30 km</span>
      <button class="panel-close" id="poi-close-btn">✕</button>
    </div>
    <div id="poi-panel-body">
      <div id="poi-categories">
        <label><input type="checkbox" value="fuel" checked /><span>⛽ Stations</span></label>
        <label><input type="checkbox" value="fast_food" checked /><span>🍔 Fast food</span></label>
        <label><input type="checkbox" value="restaurant" /><span>🍽️ Restaurants</span></label>
        <label><input type="checkbox" value="services" /><span>🛣️ Aires auto.</span></label>
        <label><input type="checkbox" value="parking" /><span>🅿️ Parkings</span></label>
        <label><input type="checkbox" value="hotel" /><span>🏨 Hôtels</span></label>
        <label><input type="checkbox" value="hospital" /><span>🏥 Hôpitaux</span></label>
        <label><input type="checkbox" value="aerodrome" /><span>✈️ Aéroports</span></label>
      </div>
      <div id="poi-actions">
        <button id="poi-search-btn">🔍 Rechercher</button>
        <button id="poi-clear-btn">🗑️</button>
        <button id="poi-close-btn-2">✕ Fermer</button>
      </div>
    </div>
  </div>

  <div id="radar-alert">📷 RADAR — <span id="alert-detail"></span></div>
  <div id="route-info"></div>
  <div id="status">Recherche de votre position...</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="radars.js"></script>

  <script>
    // =============================================
    // CONFIGURATION — remplace COLLE_TA_CLE_ICI
    // =============================================
    const ORS_API_KEY    = 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImE0NmEzNDJjZjkyODQwMDA4MjhjZGE2YmM2ZWIyZWRkIiwiaCI6Im11cm11cjY0In0=';
    const ALERT_DIST     = 700;
    const POI_RADIUS     = 30000;
    const RADAR_MIN_ZOOM = 10;
    const OVERPASS_URL   = 'https://overpass-api.de/api/interpreter';
    const NIGHT_START    = 20;
    const NIGHT_END      = 7;

    // === CARTE ===
    const map = L.map('map', { zoomControl: true }).setView([46.603354, 1.888334], 6);

    // === MODE NUIT ===
    let tileLayer = null;
    function isNightTime() {
      const h = new Date().getHours();
      return h >= NIGHT_START || h < NIGHT_END;
    }
    function applyTheme(night) {
      document.body.classList.toggle('night', night);
      document.getElementById('night-toggle').textContent = night ? '☀️' : '🌙';
      if (!tileLayer) {
        tileLayer = L.tileLayer(
          'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
          { attribution: '© OpenStreetMap', maxZoom: 19 }
        ).addTo(map);
      }
    }
    applyTheme(isNightTime());
    document.getElementById('night-toggle').onclick = () => applyTheme(!document.body.classList.contains('night'));
    setInterval(() => applyTheme(isNightTime()), 60000);

    // === DOM ===
    const statusEl     = document.getElementById('status');
    const searchInput  = document.getElementById('search-input');
    const searchBtn    = document.getElementById('search-btn');
    const routeBtn     = document.getElementById('route-btn');
    const compareBtn   = document.getElementById('compare-btn');
    const poiBtn       = document.getElementById('poi-btn');
    const favBtn       = document.getElementById('fav-btn');
    const favSaveBtn   = document.getElementById('fav-save-btn');
    const voiceBtn     = document.getElementById('voice-btn');
    const resultsDiv   = document.getElementById('results');
    const routeInfo    = document.getElementById('route-info');
    const radarAlert   = document.getElementById('radar-alert');
    const alertDetail  = document.getElementById('alert-detail');
    const radarCount   = document.getElementById('radar-count');
    const avoidTolls   = document.getElementById('avoid-tolls');
    const avoidHwy     = document.getElementById('avoid-highways');
    const showRadars   = document.getElementById('show-radars');
    const poiPanel     = document.getElementById('poi-panel');
    const poiSearchBtn = document.getElementById('poi-search-btn');
    const poiClearBtn  = document.getElementById('poi-clear-btn');
    const poiCloseBtn  = document.getElementById('poi-close-btn');
    const poiCloseBtn2 = document.getElementById('poi-close-btn-2');
    const favPanel     = document.getElementById('fav-panel');
    const favList      = document.getElementById('fav-list');
    const favCloseBtn  = document.getElementById('fav-close-btn');

    // === ÉTAT ===
    let userPosition  = null;
    let userMarker    = null;
    let searchMarker  = null;
    let destination   = null;
    let routeLayerA   = null;
    let routeLayerB   = null;
    let alertTimeout  = null;
    let alertedRadars = new Set();
    let radarMarkers  = L.layerGroup().addTo(map);
    let poiMarkers    = L.layerGroup().addTo(map);
    let currentResult = null;

    // === RECONNAISSANCE VOCALE ===
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'fr-FR';
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.onstart  = () => { voiceBtn.classList.add('listening'); showStatus('🎤 En écoute...', 0); };
      recognition.onresult = (e) => {
        const t = e.results[0][0].transcript;
        searchInput.value = t;
        showStatus(`🎤 "${t}"`, 2000);
        setTimeout(() => searchAddress(t), 500);
      };
      recognition.onerror  = (e) => { showStatus('Micro : ' + e.error, 3000); voiceBtn.classList.remove('listening'); };
      recognition.onend    = () => { voiceBtn.classList.remove('listening'); };
      voiceBtn.onclick = () => {
        if (voiceBtn.classList.contains('listening')) recognition.stop();
        else try { recognition.start(); } catch(e) { showStatus('Micro indisponible', 3000); }
      };
    } else {
      voiceBtn.style.display = 'none';
    }

    // === FAVORIS ===
    function getFavorites() {
      try { return JSON.parse(localStorage.getItem('mynav_favorites') || '[]'); } catch(e) { return []; }
    }
    function saveFavorites(favs) {
      try { localStorage.setItem('mynav_favorites', JSON.stringify(favs)); } catch(e) {}
    }
    function isFavorite(name) { return getFavorites().some(f => f.name === name); }
    function addFavorite(name, address, lat, lon) {
      const favs = getFavorites();
      if (favs.some(f => f.name === name)) return;
      favs.push({ name, address, lat, lon, ts: Date.now() });
      saveFavorites(favs); updateFavSaveBtn();
      showStatus('⭐ Ajouté aux favoris', 2000);
    }
    function removeFavorite(name) {
      saveFavorites(getFavorites().filter(f => f.name !== name));
      updateFavSaveBtn(); renderFavPanel();
    }
    function updateFavSaveBtn() {
      if (!currentResult) { favSaveBtn.classList.remove('active'); return; }
      const isFav = isFavorite(currentResult.name);
      favSaveBtn.textContent = isFav ? '★' : '⭐';
      favSaveBtn.classList.toggle('active', isFav);
    }
    function renderFavPanel() {
      const favs = getFavorites();
      if (!favs.length) {
        favList.innerHTML = '<div id="fav-empty">Aucun favori enregistré.<br><small>Recherchez une adresse puis ⭐</small></div>';
        return;
      }
      favList.innerHTML = '';
      favs.slice().reverse().forEach(f => {
        const div = document.createElement('div');
        div.className = 'fav-item';
        div.innerHTML = `
          <div style="flex:1;">
            <div class="fav-item-name">⭐ ${f.name}</div>
            <div class="fav-item-addr">${f.address||''}</div>
          </div>
          <button class="fav-del-btn">🗑️</button>`;
        div.querySelector('.fav-del-btn').onclick = (e) => { e.stopPropagation(); removeFavorite(f.name); };
        div.onclick = () => {
          destination = [f.lat, f.lon];
          if (searchMarker) map.removeLayer(searchMarker);
          const ri = new L.Icon({
            iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
            shadowUrl:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize:[25,41],iconAnchor:[12,41],popupAnchor:[1,-34],shadowSize:[41,41]
          });
          searchMarker = L.marker([f.lat,f.lon],{icon:ri}).addTo(map).bindPopup(f.name).openPopup();
          map.setView([f.lat,f.lon],14);
          searchInput.value = f.name;
          currentResult = f; updateFavSaveBtn();
          favPanel.style.display = 'none';
        };
        favList.appendChild(div);
      });
    }
    favSaveBtn.onclick = () => {
      if (!currentResult) { showStatus('Recherchez d\'abord une adresse', 2000); return; }
      if (isFavorite(currentResult.name)) { removeFavorite(currentResult.name); showStatus('Favori supprimé', 2000); }
      else addFavorite(currentResult.name, currentResult.address, currentResult.lat, currentResult.lon);
    };
    favBtn.onclick = () => {
      renderFavPanel();
      const open = favPanel.style.display !== 'none';
      closeAllPanels();
      if (!open) favPanel.style.display = 'block';
    };
    favCloseBtn.onclick = () => favPanel.style.display = 'none';

    // === CONFIG POI ===
    const POI_CONFIG = {
      fuel:       { label:'Station service',     icon:'⛽', color:'#f59e0b', query:'node["amenity"="fuel"]' },
      fast_food:  { label:'Restauration rapide', icon:'🍔', color:'#ef4444', query:'node["amenity"="fast_food"]' },
      restaurant: { label:'Restaurant',          icon:'🍽️', color:'#8b5cf6', query:'node["amenity"="restaurant"]' },
      services:   { label:'Aire autoroute',      icon:'🛣️', color:'#0ea5e9', query:'node["highway"="services"]' },
      parking:    { label:'Parking',             icon:'🅿️', color:'#64748b', query:'node["amenity"="parking"]' },
      hotel:      { label:'Hôtel',               icon:'🏨', color:'#10b981', query:'node["tourism"="hotel"]' },
      hospital:   { label:'Hôpital',             icon:'🏥', color:'#dc2626', query:'node["amenity"="hospital"]' },
      aerodrome:  { label:'Aéroport',            icon:'✈️', color:'#1d4ed8', query:'node["aeroway"="aerodrome"]' },
    };

    // === ICÔNES ===
    const RADAR_COLORS = {
      'ETF':'#dc2626','ETD':'#dc2626','ETT':'#dc2626',
      'ETU':'#ea580c','ETVM':'#7c3aed','ETFR':'#0369a1','ETPN':'#047857'
    };
    function createRadarIcon(type) {
      const color = RADAR_COLORS[type]||'#dc2626';
      const lbl   = type==='ETVM'?'↔':type==='ETFR'?'🚦':type==='ETPN'?'PN':'📷';
      return L.divIcon({
        className:'',
        html:`<div style="background:${color};width:26px;height:26px;border-radius:50%;border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,0.35);">${lbl}</div>`,
        iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-15]
      });
    }
    function createPoiIcon(cfg) {
      return L.divIcon({
        className:'',
        html:`<div style="background:${cfg.color};width:32px;height:32px;border-radius:10px;border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,0.25);">${cfg.icon}</div>`,
        iconSize:[32,32],iconAnchor:[16,16],popupAnchor:[0,-18]
      });
    }

    // === RADARS ===
    function renderRadars() {
      radarMarkers.clearLayers();
      if (!showRadars.checked) { radarCount.textContent='Masqués'; return; }
      if (map.getZoom() < RADAR_MIN_ZOOM) { radarCount.textContent='Zoomez ▼'; return; }
      const bounds = map.getBounds().pad(0.1);
      let count = 0;
      RADARS.forEach(r => {
        if (!bounds.contains([r.lat,r.lon])) return;
        L.marker([r.lat,r.lon],{icon:createRadarIcon(r.t)})
          .bindPopup(`<b>${RADAR_TYPES[r.t]||r.t}</b><br>${r.v?r.v+' km/h':'Vitesse N/A'}<br><small>${r.id}</small>`)
          .addTo(radarMarkers);
        count++;
      });
      radarCount.textContent = `📷 ${count}`;
    }

    // === ALERTE RADAR ===
    function checkRadarProximity(lat, lon) {
      if (!showRadars.checked) return;
      let nearest=null, nearestDist=Infinity;
      RADARS.forEach(r => {
        const d = map.distance([lat,lon],[r.lat,r.lon]);
        if (d<ALERT_DIST && d<nearestDist) { nearestDist=d; nearest=r; }
      });
      if (nearest && !alertedRadars.has(nearest.id)) {
        alertedRadars.add(nearest.id);
        triggerAlert(nearest, Math.round(nearestDist));
        setTimeout(() => alertedRadars.delete(nearest.id), 30000);
      }
    }
    function triggerAlert(radar, dist) {
      const vma = radar.v?`${radar.v} km/h`:'';
      alertDetail.textContent = `${RADAR_TYPES[radar.t]||radar.t}${vma?' · '+vma:''} · ${dist}m`;
      radarAlert.style.display='block'; playBeep();
      if (alertTimeout) clearTimeout(alertTimeout);
      alertTimeout = setTimeout(()=>radarAlert.style.display='none', 6000);
    }
    function playBeep() {
      try {
        const ctx=new(window.AudioContext||window.webkitAudioContext)();
        const osc=ctx.createOscillator(), gain=ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value=880; osc.type='sine';
        gain.gain.setValueAtTime(0.5,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.8);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime+0.8);
      } catch(e){}
    }

    // === GÉOLOCALISATION ===
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const lat=pos.coords.latitude, lon=pos.coords.longitude;
          userPosition=[lat,lon];
          const heading=pos.coords.heading;
          const rotation=(heading!==null&&!isNaN(heading))?heading:0;
          const carIcon=L.divIcon({
            className:'',
            html:`<div style="transform:rotate(${rotation}deg);transform-origin:center;width:40px;height:40px;">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
                <defs>
                  <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/></filter>
                  <linearGradient id="gr" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#3b82f6"/>
                    <stop offset="100%" style="stop-color:#1d4ed8"/>
                  </linearGradient>
                </defs>
                <polygon points="20,2 38,34 20,26 2,34" fill="url(#gr)" filter="url(#sh)"/>
                <polygon points="20,2 28,22 20,18 12,22" fill="#60a5fa" opacity="0.5"/>
                <circle cx="20" cy="24" r="3" fill="white" opacity="0.9"/>
              </svg>
            </div>`,
            iconSize:[40,40],iconAnchor:[20,20],popupAnchor:[0,-22]
          });
          if (!userMarker) {
            userMarker=L.marker([lat,lon],{icon:carIcon}).addTo(map).bindPopup('Votre position');
            map.setView([lat,lon],14);
            statusEl.textContent='Position trouvée ✓';
            setTimeout(()=>statusEl.style.display='none',2000);
            fetchWeather();
          } else {
            userMarker.setLatLng([lat,lon]);
            userMarker.setIcon(carIcon);
          }
          checkRadarProximity(lat,lon);
        },
        (err)=>{statusEl.textContent='Position indisponible : '+err.message;},
        {enableHighAccuracy:true,maximumAge:3000,timeout:10000}
      );
    }

    // === RECHERCHE ===
    async function searchAddress(query) {
      if (!query.trim()) return;
      searchBtn.disabled=true; searchBtn.textContent='...';
      resultsDiv.style.display='none';
      try {
        const res=await fetch(
          `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=fr&limit=5`,
          {headers:{'Accept-Language':'fr'}}
        );
        const results=await res.json();
        if (!results.length){showStatus('Aucun résultat',3000);return;}
        if (results.length===1) selectResult(results[0]);
        else displayResults(results);
      } catch(e){showStatus('Erreur : '+e.message,4000);}
      finally{searchBtn.disabled=false;searchBtn.textContent='Chercher';}
    }
    function displayResults(results) {
      resultsDiv.innerHTML='';
      results.forEach(r=>{
        const div=document.createElement('div');
        div.className='result-item';
        const isFav=isFavorite(r.display_name);
        div.innerHTML=`<span style="flex:1;">${r.display_name}</span><button class="result-fav-btn">${isFav?'★':'☆'}</button>`;
        div.querySelector('.result-fav-btn').onclick=(e)=>{
          e.stopPropagation();
          if(isFavorite(r.display_name)){removeFavorite(r.display_name);e.target.textContent='☆';}
          else{addFavorite(r.display_name,r.display_name,parseFloat(r.lat),parseFloat(r.lon));e.target.textContent='★';}
        };
        div.onclick=()=>selectResult(r);
        resultsDiv.appendChild(div);
      });
      resultsDiv.style.display='block';
    }
    function selectResult(result) {
      const lat=parseFloat(result.lat), lon=parseFloat(result.lon);
      destination=[lat,lon];
      currentResult={name:result.display_name,address:result.display_name,lat,lon};
      updateFavSaveBtn();
      if (searchMarker) map.removeLayer(searchMarker);
      const ri=new L.Icon({
        iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
        shadowUrl:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize:[25,41],iconAnchor:[12,41],popupAnchor:[1,-34],shadowSize:[41,41]
      });
      searchMarker=L.marker([lat,lon],{icon:ri}).addTo(map).bindPopup(result.display_name).openPopup();
      map.setView([lat,lon],14);
      resultsDiv.style.display='none';
    }

    // === ORS ===
    async function fetchRoute(avoidFeatures) {
      const body={coordinates:[[userPosition[1],userPosition[0]],[destination[1],destination[0]]]};
      if (avoidFeatures.length) body.options={avoid_features:avoidFeatures};
      const res=await fetch(
        'https://api.openrouteservice.org/v2/directions/driving-car/geojson',
        {method:'POST',headers:{'Authorization':ORS_API_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}
      );
      if (!res.ok) throw new Error('ORS '+res.status);
      return await res.json();
    }
    function formatRoute(data) {
      const route=data.features[0];
      const coords=route.geometry.coordinates.map(c=>[c[1],c[0]]);
      const distKm=(route.properties.summary.distance/1000).toFixed(1);
      const durMin=Math.round(route.properties.summary.duration/60);
      const h=Math.floor(durMin/60),m=durMin%60;
      return {coords,distKm,duree:h>0?`${h}h ${m}min`:`${m} min`};
    }

    async function calculateRoute() {
      if (!userPosition){showStatus('Position GPS non disponible',3000);return;}
      if (!destination) {showStatus('Destination non définie',3000);return;}
      routeBtn.disabled=true;
      clearRoutes();
      const avoid=[];
      if (avoidTolls.checked) avoid.push('tollways');
      if (avoidHwy.checked)   avoid.push('highways');
      try {
        const data=await fetchRoute(avoid);
        const {coords,distKm,duree}=formatRoute(data);
        routeLayerA=L.polyline(coords,{color:'#1a56db',weight:6,opacity:0.85}).addTo(map);
        map.setView(userPosition,15);
        const label=avoid.includes('tollways')?'Sans péage':'Itinéraire';
        routeInfo.innerHTML=`
          <div class="route-row">
            <div class="route-dot" style="background:#16a34a;"></div>
            <span class="route-label" style="color:#16a34a;font-weight:700;">🚗 Allons-y !</span>
            <span class="route-data">${distKm} km — ${duree}</span>
            <span class="route-label">${label}</span>
          </div>`;
        routeInfo.style.display='block';
      } catch(e){showStatus('Erreur itinéraire : '+e.message,5000);}
      finally{routeBtn.disabled=false;}
    }

    async function compareRoutes() {
      if (!userPosition){showStatus('Position GPS non disponible',3000);return;}
      if (!destination) {showStatus('Destination non définie',3000);return;}
      compareBtn.disabled=true;
      clearRoutes();
      try {
        const avoid=avoidHwy.checked?['highways']:[];
        const [dataA,dataB]=await Promise.all([
          fetchRoute([...avoid,'tollways']),
          fetchRoute([...avoid])
        ]);
        const a=formatRoute(dataA), b=formatRoute(dataB);
        routeLayerB=L.polyline(b.coords,{color:'#ea580c',weight:6,opacity:0.7}).addTo(map);
        routeLayerA=L.polyline(a.coords,{color:'#1a56db',weight:6,opacity:0.9}).addTo(map);
        map.setView(userPosition,15);
        routeInfo.innerHTML=`
          <div class="route-row">
            <div class="route-dot" style="background:#16a34a;"></div>
            <span class="route-label" style="color:#16a34a;font-weight:700;">🚗 Allons-y !</span>
          </div>
          <div class="route-row">
            <div class="route-dot" style="background:#1a56db;"></div>
            <span class="route-label">Sans péage</span>
            <span class="route-data">${a.distKm} km — ${a.duree}</span>
          </div>
          <div class="route-row">
            <div class="route-dot" style="background:#ea580c;"></div>
            <span class="route-label">Avec péages</span>
            <span class="route-data">${b.distKm} km — ${b.duree}</span>
          </div>`;
        routeInfo.style.display='block';
      } catch(e){showStatus('Erreur comparaison : '+e.message,5000);}
      finally{compareBtn.disabled=false;}
    }

    function clearRoutes() {
      if (routeLayerA){map.removeLayer(routeLayerA);routeLayerA=null;}
      if (routeLayerB){map.removeLayer(routeLayerB);routeLayerB=null;}
      routeInfo.style.display='none';
    }

    // === POI ===
    async function searchPOI() {
      if (!userPosition){showStatus('Position GPS non disponible',3000);return;}
      const selected=[...document.querySelectorAll('#poi-categories input:checked')].map(i=>i.value);
      if (!selected.length){showStatus('Sélectionnez au moins une catégorie',3000);return;}
      poiSearchBtn.disabled=true; poiSearchBtn.textContent='Recherche...';
      poiMarkers.clearLayers();
      const [lat,lon]=userPosition;
      const queries=selected.map(k=>`${POI_CONFIG[k].query}(around:${POI_RADIUS},${lat},${lon});`).join('\n');
      try {
        const res=await fetch(OVERPASS_URL,{method:'POST',body:'data='+encodeURIComponent(`[out:json][timeout:25];\n(\n${queries}\n);\nout body;`)});
        if (!res.ok) throw new Error('Overpass '+res.status);
        const data=await res.json();
        const elements=data.elements||[];
        if (!elements.length){showStatus('Aucun POI trouvé',3000);return;}
        elements.forEach(el=>{
          if (!el.lat||!el.lon) return;
          const tags=el.tags||{};
          let cfg=null;
          if      (tags.amenity==='fuel')        cfg=POI_CONFIG.fuel;
          else if (tags.amenity==='fast_food')   cfg=POI_CONFIG.fast_food;
          else if (tags.amenity==='restaurant')  cfg=POI_CONFIG.restaurant;
          else if (tags.highway==='services')    cfg=POI_CONFIG.services;
          else if (tags.amenity==='parking')     cfg=POI_CONFIG.parking;
          else if (tags.tourism==='hotel')       cfg=POI_CONFIG.hotel;
          else if (tags.amenity==='hospital')    cfg=POI_CONFIG.hospital;
          else if (tags.aeroway==='aerodrome')   cfg=POI_CONFIG.aerodrome;
          if (!cfg) return;
          const name=tags.name||cfg.label;
          const dist=Math.round(map.distance(userPosition,[el.lat,el.lon]));
          const poiLat=el.lat, poiLon=el.lon;
          const popup=L.popup().setContent((()=>{
            const div=document.createElement('div');
            div.style.fontFamily='Inter,system-ui,sans-serif';
            div.innerHTML=`<b style="font-size:14px;">${cfg.icon} ${name}</b><br><span style="color:#475569;font-size:12px;">${cfg.label} · ${dist} m</span>`;
            const btn=document.createElement('button');
            btn.textContent='🗺️ Itinéraire';
            btn.style.cssText='margin-top:10px;width:100%;padding:9px;background:#1a56db;color:white;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;';
            btn.onclick=()=>{destination=[poiLat,poiLon];map.closePopup();calculateRoute();};
            div.appendChild(btn);
            return div;
          })());
          L.marker([el.lat,el.lon],{icon:createPoiIcon(cfg)}).bindPopup(popup).addTo(poiMarkers);
        });
        showStatus(`${elements.length} POI trouvés`,2000);
        poiPanel.style.display='none';
        const group=L.featureGroup([userMarker,...poiMarkers.getLayers()]);
        map.fitBounds(group.getBounds(),{padding:[40,40]});
      } catch(e){showStatus('Erreur POI : '+e.message,5000);}
      finally{poiSearchBtn.disabled=false;poiSearchBtn.textContent='🔍 Rechercher';}
    }
    function clearPOI(){poiMarkers.clearLayers();showStatus('POI effacés',2000);}

    // === MÉTÉO ===
    const WMO={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'🌨️',77:'🌨️',80:'🌦️',81:'🌧️',82:'🌧️',85:'🌨️',86:'🌨️',95:'⛈️',96:'⛈️',99:'⛈️'};
    async function fetchWeather() {
      if (!userPosition) return;
      try {
        const [lat,lon]=userPosition;
        const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode&timezone=auto`);
        if (!res.ok) return;
        const data=await res.json();
        document.getElementById('weather-display').textContent=`${WMO[data.current.weathercode]||'🌡️'} ${Math.round(data.current.temperature_2m)}°C`;
      } catch(e){}
    }
    setInterval(fetchWeather,600000);

    // === UTILITAIRES ===
    function showStatus(msg,duration){
      statusEl.textContent=msg; statusEl.style.display='block';
      if(duration) setTimeout(()=>statusEl.style.display='none',duration);
    }
    function closeAllPanels(){
      resultsDiv.style.display='none';
      poiPanel.style.display='none';
      favPanel.style.display='none';
    }

    // === ÉVÉNEMENTS ===
    searchBtn.onclick     = ()=>searchAddress(searchInput.value);
    searchInput.onkeydown = (e)=>{if(e.key==='Enter')searchAddress(searchInput.value);};
    routeBtn.onclick      = calculateRoute;
    compareBtn.onclick    = compareRoutes;
    poiBtn.onclick        = ()=>{const o=poiPanel.style.display!=='none';closeAllPanels();if(!o)poiPanel.style.display='block';};
    poiSearchBtn.onclick  = searchPOI;
    poiClearBtn.onclick   = clearPOI;
    poiCloseBtn.onclick   = ()=>poiPanel.style.display='none';
    poiCloseBtn2.onclick  = ()=>poiPanel.style.display='none';
    showRadars.onchange   = renderRadars;
    map.on('click',   closeAllPanels);
    map.on('moveend', renderRadars);
    map.on('zoomend', renderRadars);

    renderRadars();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', ()=>{
        navigator.serviceWorker.register('/sw.js')
          .then(()=>console.log('SW ok'))
          .catch(e=>console.warn('SW:',e));
      });
    }
  </script>

</body>
</html>
